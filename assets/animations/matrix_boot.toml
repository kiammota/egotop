[animation]
name = "matrix_boot"
display_name = "Matrix Boot"
author = "egotop"
description = "Retro terminal boot sequence resolving scrambled glyphs."
version = 2
duration_ms = 650
mode = "transition"
target = "window"

[animation.loop]
mode = "once"

[[tracks]]
id = "matrix-boot"
type = "transition"
