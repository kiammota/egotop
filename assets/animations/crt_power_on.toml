[animation]
name = "crt_power_on"
display_name = "CRT Power On"
author = "egotop"
description = "Classic CRT beam expanding vertically into the full screen."
version = 2
duration_ms = 600
mode = "transition"
target = "window"

[animation.loop]
mode = "once"

[[tracks]]
id = "crt"
type = "transition"
effect = "crt_line"
duration_ms = 600
easing = "ease_in_out"
target = "window"
