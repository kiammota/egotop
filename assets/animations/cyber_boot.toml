schema_version = 1
name = "cyber_boot"
display_name = "Cyber Boot (Community)"
author = "egotop"
description = "Initial CRT flash followed by Matrix scramble and smooth reveal."

[[steps]]
effect = "crt_line"
duration_ms = 320
easing = "ease_out"
target = "window"
color = "#39FF88"

[[steps]]
effect = "matrix_scramble"
duration_ms = 550
easing = "ease_in_out"
target = "content"
chars = "01ｱｶｻﾀﾅﾊ#$"

[[steps]]
effect = "fade"
duration_ms = 350
easing = "ease_out"
target = "content"
