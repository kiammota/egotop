[animation]
name = "cursor-expand"
display_name = "Cursor Expand"
author = "egotop"
description = "Radial expansion starting from the startup cursor position."
version = 2
duration_ms = 600
mode = "transition"
target = "window"

[animation.loop]
mode = "once"

[[tracks]]
id = "cursor-expand"
type = "transition"
effect = "cursor_expand"
duration_ms = 600
easing = "ease_out"
target = "window"
