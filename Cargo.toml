[package]
name = "egotop"
version = "0.1.0"
edition = "2024"
description = "Interactive animated terminal welcome dashboard for Linux & Hyprland"
license = "MIT"
readme = "README.md"

[lib]
name = "egotop"
path = "src/lib.rs"

[[bin]]
name = "egotop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6.0"
libc = "0.2"
procfs = "0.18"
rand = "0.9"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
toml = "0.8"
unicode-width = "0.2"
