# ==============================================================================
# egotop — Interactive Terminal Welcome Dashboard Configuration
# Location: ~/.config/egotop.toml
# ==============================================================================

[general]
name = "egotop"
# Placeholders supported: {user}, {host}, {distro}, {wm}
greeting = "Olá, {user}!"
# Optional display name override (leave commented to use system username)
# user_override = "Kiam"
message = "Bem-vindo de volta ao seu ambiente Linux."
# System metrics refresh interval in milliseconds
refresh_rate_ms = 1000
# Background animation frame rate (1 - 120)
animation_fps = 30
time_format = "%H:%M:%S"
date_format = "%d/%m/%Y"
# If true, hides fields whose values cannot be detected; otherwise shows "N/A"
hide_unavailable = false
# Default view mode: "dashboard" | "compact" | "minimal"
view_mode = "dashboard"
# Initial page (1..=3)
default_page = 1
# Startup transition animation: "crt_power_on" | "curtains" | "fade" | "slide" | "matrix_boot" | "none"
# Or any custom animation name from ~/.config/egotop/animations/*.toml
startup_animation = "matrix_boot"
startup_duration_ms = 1100

[theme]
# Built-in presets: "matrix" | "cyberpunk" | "nord" | "amber" | "dracula" | "custom"
name = "matrix"
# Use "reset" to inherit terminal transparency, or hex ("#050907") / named ("black")
background = "#050A07"
panel_background = "#08110C"
primary = "#39FF88"
secondary = "#00D9FF"
accent = "#FFC857"
text = "#E5E5E5"
muted = "#5F7D6B"
border = "#1F7A4C"
danger = "#FF5555"
# Border style: "rounded" | "plain" | "double" | "thick"
border_type = "rounded"

[typography]
# Available ASCII fonts:
# "ANSI Shadow", "Standard", "Big", "Slant", "Small", "Block", "Doom"
font = "ANSI Shadow"
logo_font = "Standard"
# Enable Nerd Font icons (automatically falls back to ASCII if ascii_fallback = true)
use_nerd_fonts = true
ascii_fallback = false
# Built-in logos: "auto" | "arch" | "hyprland" | "linux" | "egotop" | "none"
logo_preset = "auto"
# Optional custom ASCII logo inline or from a file:
# custom_logo = """
#   /\
#  /  \
# """
# custom_logo_file = "~/.config/egotop_logo.txt"

[header]
enabled = true
show_clock = true
show_date = true
show_indicators = true
show_fps = false

[background]
# Active effect: "matrix" | "water" | "particles" | "scanlines" | "none"
effect = "matrix"
enabled = true
speed = 1.0
density = 0.60
opacity = 0.38

[background.matrix]
enabled = true
speed = 1.0
density = 0.60
min_length = 5
max_length = 18
color = "#1F7A4C"
head_color = "#39FF88"
# Charset: "katakana" | "hex" | "ascii" | "binary"
charset = "katakana"
# Optional region restriction (percentages 0..=100 or cell coordinates):
# region = { x = 0, y = 0, width = 100, height = 100, unit = "percent" }

[background.water]
enabled = false
speed = 1.0
amplitude = 0.6
density = 0.7
color = "#0088AA"
crest_color = "#00D9FF"

[background.particles]
enabled = false
speed = 0.9
density = 0.5
count = 45
color = "#39FF88"
chars = "·•✦∘*+"

[background.scanlines]
enabled = false
speed = 1.0
spacing = 2
intensity = 0.35
color = "#164A2E"

[layout]
# Layout mode: "responsive" | "free" | "compact"
mode = "responsive"
padding = 1
gap = 1
min_width_for_split = 88

# ==============================================================================
# Widgets — Each panel can be customized independently
# Positions: "top-left", "top-center", "top-right",
#            "center-left", "center", "center-right",
#            "bottom-left", "bottom-center", "bottom-right", "absolute"
# ==============================================================================

[[widgets]]
id = "greeting"
enabled = true
title = "Bem-vindo"
position = "top-center"
page = 1
z_index = 20
align = "center"
font = "ANSI Shadow"
reveal_animation = true
show_border = true

[[widgets]]
id = "system"
enabled = true
title = "Sistema"
position = "center-left"
page = 1
width = "50%"
z_index = 10
align = "left"

[[widgets]]
id = "hardware"
enabled = true
title = "Hardware"
position = "center-right"
page = 1
width = "50%"
z_index = 10
align = "left"
graph_style = "bar"

[[widgets]]
id = "activity"
enabled = true
title = "Atividade"
position = "bottom-left"
page = 1
width = "60%"
z_index = 10
graph_style = "sparkline"

[[widgets]]
id = "session"
enabled = true
title = "Sessão & Uptime"
position = "bottom-right"
page = 1
width = "40%"
z_index = 10

[[widgets]]
id = "message"
enabled = false
title = "Mensagem"
position = "bottom-center"
page = 1
z_index = 15
align = "center"
