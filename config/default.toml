# ==============================================================================
# egotop — Interactive Terminal Welcome Dashboard Configuration
# Location: ~/.config/egotop.toml
# ==============================================================================

[general]
name = "egotop"
# Placeholders supported: {user}, {host}, {distro}, {wm}
greeting = "Hello, {user}!"
# Optional display name override (leave commented to use system username)
# user_override = "Kiam"
message = "Welcome back to your Linux environment."
# System metrics refresh interval in milliseconds
refresh_rate_ms = 1000
# Background animation frame rate (1 - 120)
animation_fps = 30
time_format = "%H:%M:%S"
date_format = "%m/%d/%Y"
# If true, hides fields whose values cannot be detected; otherwise shows "N/A"
hide_unavailable = false
# Default view mode: "dashboard" | "compact" | "minimal"
view_mode = "dashboard"
# Startup transition animation: "crt_power_on" | "curtains" | "fade" | "slide" | "matrix_boot" | "none"
# Or any custom animation name from ~/.config/egotop/animations/*.toml
startup_animation = "matrix_boot"
startup_duration_ms = 1100

[theme]
# Built-in presets: "matrix" | "cyberpunk" | "nord" | "amber" | "dracula" | "custom"
name = "matrix"
# Use "reset" to inherit terminal transparency, or hex ("#050907") / named ("black")
background = "#050A07"
panel_background = "#08110C"
primary = "#39FF88"
secondary = "#00D9FF"
accent = "#FFC857"
text = "#E5E5E5"
muted = "#5F7D6B"
border = "#1F7A4C"
danger = "#FF5555"
# Border style: "rounded" | "plain" | "double" | "thick"
border_type = "rounded"

# Optional per-character border customization:
# [theme.borders]
# top_left = "╭"
# top_right = "╮"
# bottom_left = "╰"
# bottom_right = "╯"
# horizontal = "─"
# vertical = "│"
# left_separator = "├"
# right_separator = "┤"
# top_separator = "┬"
# bottom_separator = "┴"
# intersection = "┼"

[startup]
# Startup mode: "normal" | "cursor"
mode = "normal"
animation = "cursor-expand"
trigger = "mouse"

[startup.cursor]
character = "▌"
blink = true
blink_interval = 500
color = "#39FF88"

[typography]
# Available ASCII fonts:
# "ANSI Shadow", "Standard", "Big", "Slant", "Small", "Block", "Doom"
font = "ANSI Shadow"
logo_font = "Standard"
# Enable Nerd Font icons (automatically falls back to ASCII if ascii_fallback = true)
use_nerd_fonts = true
ascii_fallback = false
# Built-in logos: "auto" | "arch" | "hyprland" | "linux" | "egotop" | "none"
logo_preset = "auto"
# Optional custom ASCII logo inline or from a file:
# custom_logo = """
#   /\
#  /  \
# """
# custom_logo_file = "~/.config/egotop_logo.txt"

[header]
enabled = true
show_clock = true
show_date = true
show_indicators = true
show_fps = false

[background]
# Active effect: "matrix" | "water" | "particles" | "scanlines" | "none"
effect = "matrix"
enabled = true
speed = 1.0
density = 0.60
opacity = 0.38

[background.matrix]
enabled = true
speed = 1.0
density = 0.60
min_length = 5
max_length = 18
color = "#1F7A4C"
head_color = "#39FF88"
# Charset: "katakana" | "hex" | "ascii" | "binary"
charset = "katakana"
# Optional region restriction (percentages 0..=100 or cell coordinates):
# region = { x = 0, y = 0, width = 100, height = 100, unit = "percent" }

[background.water]
enabled = false
speed = 1.0
amplitude = 0.6
density = 0.7
color = "#0088AA"
crest_color = "#00D9FF"

[background.particles]
enabled = false
speed = 0.9
density = 0.5
count = 45
color = "#39FF88"
chars = "·•✦∘*+"

[background.scanlines]
enabled = false
speed = 1.0
spacing = 2
intensity = 0.35
color = "#164A2E"

[ui.root]
id = "root"
visible = true
direction = "vertical"
width = "100%"
height = "100%"
padding = 1
gap = 1

[[ui.root.children]]
node = "component"
id = "header"
category = "dynamic"
type = "header"
width = "fill"
height = 1

[[ui.root.children]]
node = "component"
id = "greeting"
category = "static"
type = "greeting"
width = "fill"
height = 7
min_height = 5

[ui.root.children.visual]
align = "center"
padding = 1
font = "ANSI Shadow"

[ui.root.children.visual.border]
enabled = true
style = "rounded"
title = "Welcome"

[[ui.root.children]]
node = "container"
id = "middle_row"
direction = "horizontal"
width = "fill"
height = "fill"
min_height = 6
gap = 1

[[ui.root.children.children]]
node = "component"
id = "system"
category = "dynamic"
type = "system"
width = "50%"
height = "fill"

[ui.root.children.children.visual]
align = "left"
padding = 1

[ui.root.children.children.visual.border]
enabled = true
style = "rounded"
title = "System"

[[ui.root.children.children]]
node = "component"
id = "hardware"
category = "dynamic"
type = "hardware"
width = "50%"
height = "fill"

[ui.root.children.children.visual]
align = "left"
padding = 1
graph_style = "bar"

[ui.root.children.children.visual.border]
enabled = true
style = "rounded"
title = "Hardware"

[[ui.root.children]]
node = "container"
id = "bottom_row"
direction = "horizontal"
width = "fill"
height = "fill"
min_height = 6
gap = 1

[[ui.root.children.children]]
node = "component"
id = "activity"
category = "dynamic"
type = "activity"
width = "60%"
height = "fill"

[ui.root.children.children.visual]
align = "left"
padding = 1
graph_style = "sparkline"

[ui.root.children.children.visual.border]
enabled = true
style = "rounded"
title = "Activity"

[[ui.root.children.children]]
node = "component"
id = "session"
category = "dynamic"
type = "session"
width = "40%"
height = "fill"

[ui.root.children.children.visual]
align = "left"
padding = 1

[ui.root.children.children.visual.border]
enabled = true
style = "rounded"
title = "Session & Uptime"

[[ui.root.children]]
node = "component"
id = "status_spinner"
category = "animated"
type = "spinner"
width = "fill"
height = 1

[ui.root.children.content]
text = "Monitoring system telemetry"

[ui.root.children.animation]
fps = 12
speed = 1.0
loop_anim = true
style = "braille"
