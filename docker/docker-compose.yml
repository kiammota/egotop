services:
  linux-rust:
    build:
      context: .
      dockerfile: Dockerfile
    image: egotop-linux-rust:latest
    container_name: egotop-linux-rust
    working_dir: /workspace
    stdin_open: true
    tty: true
    environment:
      TERM: xterm-256color
      COLORTERM: truecolor
    volumes:
      - ..:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git

volumes:
  cargo-registry:
  cargo-git:
